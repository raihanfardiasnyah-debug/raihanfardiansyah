<style>
:root{
  --navy:#0A2A43;
  --ocean:#0F5C97;
  --sky:#4FB3E8;
  --foam:#F1F7FC;
  --white:#FFFFFF;
  --ink:#0A2A43;
  --line:#D7E6F2;
  --good:#1F9D6B;
  --warn:#C97A2B;
  --shadow: 0 10px 30px -12px rgba(10,42,67,0.25);
  --radius: 18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(79,179,232,0.18), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(15,92,151,0.15), transparent 55%),
    var(--foam);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.stencil{font-family:'Big Shoulders Stencil',sans-serif; font-weight:800; letter-spacing:0.02em;}
#app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

.topbar{background:linear-gradient(135deg, var(--navy), var(--ocean)); color:var(--white); padding:18px 20px 26px; position:relative; overflow:hidden;}
.topbar::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:22px; background:radial-gradient(circle at 10px 0, transparent 12px, var(--foam) 13px) 0 -2px/24px 24px repeat-x;}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-badge{width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid rgba(255,255,255,0.25);}
.brand-title{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.85; margin:0;}
.brand-sub{font-size:19px; font-weight:700; margin:0; line-height:1.15;}
.back-btn{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:var(--white); width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;}
.back-btn:active{background:rgba(255,255,255,0.25);}
.eyebrow{font-size:11px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.8; margin:14px 0 2px;}
.screen-title{font-size:26px; margin:0; font-weight:800;}

.content{flex:1; padding:22px 20px 100px;}
.card{background:var(--white); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:14px;}
.role-grid{display:flex; flex-direction:column; gap:14px; margin-top:6px;}
.role-card{display:flex; align-items:center; gap:14px; background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px; cursor:pointer; box-shadow:var(--shadow); text-align:left; width:100%; transition:transform .15s ease; position:relative; overflow:hidden;}
.role-card:active{transform:scale(0.98);}
.role-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--ocean);}
.role-icon{width:52px; height:52px; border-radius:14px; background:var(--foam); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; border:1px solid var(--line);}
.role-text h3{margin:0 0 3px; font-size:17px; font-weight:700;}
.role-text p{margin:0; font-size:13px; color:#5C7B94;}
.role-arrow{margin-left:auto; color:var(--ocean); font-size:20px;}

.section-label{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ocean); font-weight:600; margin:0 0 10px;}
.chip-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.chip{background:var(--white); border:1.5px solid var(--line); border-radius:14px; padding:14px 12px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px;}
.chip:active{transform:scale(0.97);}
.chip.selected{border-color:var(--ocean); background:linear-gradient(135deg,#EAF5FD,#F1F7FC);}
.chip-code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ocean); font-weight:600;}
.chip-name{font-size:14px; font-weight:600; line-height:1.25;}
.chip-count{font-size:11px; color:#7591A8;}

.activity-list{display:flex; flex-direction:column; gap:10px;}
.activity-row{display:flex; align-items:center; gap:12px; background:var(--white); border:1.5px solid var(--line); border-radius:14px; padding:14px; cursor:pointer;}
.activity-row.selected{border-color:var(--ocean); background:#EAF5FD;}
.activity-num{width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'IBM Plex Mono',monospace;}
.activity-name{font-weight:600; font-size:15px;}
.activity-sub{font-size:12px; color:#7591A8; margin-top:2px;}

.search-box{display:flex; align-items:center; gap:8px; background:var(--white); border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:12px;}
.search-box input{border:none; outline:none; flex:1; font-size:15px; font-family:inherit; background:transparent; min-width:0;}
.search-box .sbtn{flex-shrink:0; padding:9px 16px; border-radius:10px; font-size:13px; font-weight:700; border:none; cursor:pointer; background:linear-gradient(135deg, var(--ocean), var(--navy)); color:#fff;}

.student-list{display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; padding-right:2px;}
.student-row{display:flex; align-items:center; gap:10px; background:var(--white); border:1.5px solid var(--line); border-radius:14px; padding:11px 13px;}
.student-row.done{opacity:0.6;}
.student-id{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:var(--white); background:var(--ocean); border-radius:8px; padding:5px 8px; flex-shrink:0; min-width:52px; text-align:center;}
.student-row.done .student-id{background:var(--good);}
.student-name{font-weight:600; font-size:14px; flex:1;}
.student-status{font-size:11px; color:var(--good); font-weight:600; margin-right:2px; white-space:nowrap;}
.icon-btn{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--foam); border:1px solid var(--line); color:var(--ocean); cursor:pointer; flex-shrink:0;}
.mark-btn{width:auto; padding:7px 14px; border-radius:10px; font-size:12.5px; font-weight:700; border:1.5px solid var(--ocean); background:var(--white); color:var(--ocean); cursor:pointer; flex-shrink:0;}

.summary-bar{display:flex; gap:10px; margin-bottom:14px;}
.summary-pill{flex:1; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
.summary-pill .num{font-size:22px; font-weight:800; font-family:'IBM Plex Mono',monospace; color:var(--navy);}
.summary-pill .lbl{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:#7591A8; margin-top:2px;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--navy); margin-bottom:6px;}
.field input, .field select{width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:15px; font-family:inherit; outline:none; background:var(--white);}
.field input:focus, .field select:focus{border-color:var(--ocean);}
.field input[readonly]{background:var(--foam); color:#4A6B85;}

.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px; border-radius:14px; border:none; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;}
.btn-primary{background:linear-gradient(135deg, var(--ocean), var(--navy)); color:#fff; box-shadow:0 8px 20px -8px rgba(15,92,151,0.6);}
.btn-primary:active{transform:scale(0.98);}
.btn-secondary{background:var(--white); color:var(--ocean); border:1.5px solid var(--ocean);}
.btn-ghost{background:transparent; color:var(--ocean); border:1.5px dashed var(--sky);}
.btn:disabled{opacity:0.5; cursor:not-allowed;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

.ticket{background:var(--white); border-radius:20px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--line); position:relative; margin-bottom:18px;}
.ticket-top{background:linear-gradient(135deg, var(--navy), var(--ocean)); color:#fff; padding:20px; display:flex; align-items:center; gap:14px; position:relative;}
.ticket-photo{width:64px; height:64px; border-radius:50%; border:3px solid rgba(255,255,255,0.6); object-fit:cover; background:rgba(255,255,255,0.15); flex-shrink:0;}
.ticket-name{font-size:17px; font-weight:800; margin:0 0 2px;}
.ticket-class{font-size:12px; opacity:0.85; font-family:'IBM Plex Mono',monospace;}
.stamp{position:absolute; top:14px; right:16px; border:2.5px solid #4FE0A0; color:#4FE0A0; border-radius:8px; padding:4px 10px; font-family:'Big Shoulders Stencil',sans-serif; font-weight:800; font-size:14px; letter-spacing:0.08em; transform:rotate(8deg); background:rgba(79,224,160,0.08);}
.perforation{height:0; border-top:2px dashed var(--line); position:relative; margin:0;}
.perforation::before, .perforation::after{content:""; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--foam);}
.perforation::before{left:-9px;} .perforation::after{right:-9px;}
.ticket-bottom{padding:18px 20px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.ticket-field .k{font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#7591A8; margin-bottom:3px;}
.ticket-field .v{font-size:14px; font-weight:700; font-family:'IBM Plex Mono',monospace;}

.cam-overlay{position:fixed; inset:0; background:rgba(10,20,30,0.92); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
.cam-frame{width:min(88vw,340px); aspect-ratio:3/4; border-radius:22px; overflow:hidden; background:#000; border:3px solid rgba(255,255,255,0.25); position:relative;}
.cam-frame video, .cam-frame img{width:100%; height:100%; object-fit:cover;}
.cam-controls{display:flex; gap:16px; margin-top:22px; align-items:center;}
.cam-shutter{width:68px; height:68px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,0.4); cursor:pointer;}
.cam-btn-round{width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.35); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
.cam-hint{color:#fff; opacity:0.75; font-size:12px; margin-top:14px; text-align:center;}
.scan-frame{width:100%; max-width:320px; aspect-ratio:3/4; border-radius:22px; overflow:hidden; background:#000; position:relative; margin:0 auto 14px; border:3px solid rgba(10,42,67,0.15);}
.scan-frame video{width:100%; height:100%; object-fit:cover;}
.scan-target{position:absolute; inset:14% 10%; border:3px solid rgba(255,255,255,0.8); border-radius:18px; pointer-events:none; box-shadow:0 0 0 999px rgba(0,0,0,0.25);}

.empty-state{text-align:center; padding:40px 20px; color:#7591A8;}
.empty-state .ic{font-size:40px; margin-bottom:10px;}
.gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.gallery .g-item{border-radius:12px; overflow:hidden; aspect-ratio:1; position:relative; background:var(--foam); border:1px solid var(--line);}
.gallery .g-item img{width:100%; height:100%; object-fit:cover;}
.gallery .g-item .g-name{position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,0.7)); color:#fff; font-size:9px; padding:3px 5px; text-align:center; font-weight:600;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 20px; border-radius:30px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:200; max-width:88vw; text-align:center;}
.loader{display:flex; align-items:center; justify-content:center; padding:30px; gap:10px; color:var(--ocean); font-weight:600; font-size:13px;}
.spin{width:18px; height:18px; border:2.5px solid var(--line); border-top-color:var(--ocean); border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.tabbar{display:flex; gap:8px; margin-bottom:16px; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:5px;}
.tab{flex:1; text-align:center; padding:9px 6px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; color:#7591A8;}
.tab.active{background:var(--ocean); color:#fff;}

table.recap{width:100%; border-collapse:collapse; font-size:12.5px;}
table.recap th{text-align:left; padding:8px 6px; color:#7591A8; font-weight:600; border-bottom:1.5px solid var(--line); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;}
table.recap td{padding:9px 6px; border-bottom:1px solid var(--line);}
.bar-bg{background:var(--foam); border-radius:6px; height:6px; width:100%; overflow:hidden; margin-top:4px;}
.bar-fill{background:var(--ocean); height:100%; border-radius:6px;}

.pass-input{display:flex; gap:8px; justify-content:center; margin:18px 0;}
.pass-input input{width:46px; height:56px; text-align:center; font-size:22px; border-radius:12px; border:1.5px solid var(--line); font-family:'IBM Plex Mono',monospace; font-weight:700;}
.footer-note{text-align:center; font-size:11px; color:#93A9BC; margin-top:18px; padding-bottom:6px;}
.divider{height:1px; background:var(--line); margin:16px 0;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
</style>
</head>

/* ================= STORAGE HELPERS ================= */
/* Pakai penyimpanan lintas-perangkat Claude (window.storage) kalau tersedia.
   Kalau tidak tersedia (mis. file dibuka di luar aplikasi Claude), otomatis
   memakai penyimpanan lokal perangkat ini supaya input TIDAK PERNAH gagal —
   hanya saja datanya tidak tersinkron ke perangkat lain. */
let storageMode = 'checking'; // 'cloud' | 'local'
async function detectStorageMode(){
  try{
    if(window.storage && typeof window.storage.list==='function'){
      await window.storage.list('__ping__', true);
      storageMode = 'cloud';
      return;
    }
  }catch(e){}
  storageMode = 'local';
}
function lsKey(key){ return 'presensi_ota_'+key; }
async function storeGet(key){
  if(storageMode==='cloud'){
    try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{ const v = localStorage.getItem(lsKey(key)); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function storeSet(key,val){
  if(storageMode==='cloud'){
    try{ await window.storage.set(key, JSON.stringify(val), true); return true; }
    catch(e){ /* jatuh ke penyimpanan lokal di bawah */ }
  }
  try{ localStorage.setItem(lsKey(key), JSON.stringify(val)); return true; }
  catch(e){ toast('Gagal menyimpan, coba lagi.'); return false; }
}
async function storeDelete(key){
  if(storageMode==='cloud'){
    try{ await window.storage.delete(key, true); return true; }catch(e){}
  }
  try{ localStorage.removeItem(lsKey(key)); return true; }catch(e){ return false; }
}
async function storeList(prefix){
  if(storageMode==='cloud'){
    try{ const r = await window.storage.list(prefix, true); return (r && r.keys) ? r.keys : []; }
    catch(e){ return []; }
  }
  try{
    const keys=[]; const p = lsKey(prefix);
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(p)===0) keys.push(k.slice('presensi_ota_'.length)); }
    return keys;
  }catch(e){ return []; }
}
function attKey(activity,code,no){ return 'att:'+activity+':'+code+':'+no; }
function pattKey(activity,idPart){ return 'patt:'+activity+':'+sanitizeKeyPart(idPart); }
function tamuKey(idPart){ return 'tamu:'+sanitizeKeyPart(idPart); }

/* ================= CAMERA (foto biasa, mis. tambah foto peserta) ================= */
async function openCamera(onCapture, opts){
  opts = opts || {};
  const overlay = document.createElement('div');
  overlay.className='cam-overlay';
  overlay.innerHTML = `
    <div class="cam-frame" id="camFrame"><video id="camVideo" autoplay playsinline muted></video></div>
    <div class="cam-controls">
      <div class="cam-btn-round" id="camClose">✕</div>
      <div class="cam-shutter" id="camShutter"></div>
      <div class="cam-btn-round" id="camFlip">⟳</div>
    </div>
    <div class="cam-hint">Posisikan objek di dalam bingkai, lalu tekan tombol putih</div>
  `;
  document.body.appendChild(overlay);
  let facing = opts.facing || 'user';
  async function startStream(){
    try{
      if(stream){ stream.getTracks().forEach(t=>t.stop()); }
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
      const v = document.getElementById('camVideo');
      v.srcObject = stream;
      v.style.transform = facing==='user' ? 'scaleX(-1)' : 'none';
    }catch(e){
      toast('Kamera tidak dapat diakses. Periksa izin kamera pada browser.');
      closeCam();
      if(opts.onSkip) opts.onSkip();
    }
  }
  function closeCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } overlay.remove(); }
  document.getElementById('camClose').onclick = ()=>{ closeCam(); if(opts.onCancel) opts.onCancel(); };
  document.getElementById('camFlip').onclick = ()=>{ facing = facing==='user'?'environment':'user'; startStream(); };
  document.getElementById('camShutter').onclick = ()=>{
    const v = document.getElementById('camVideo');
    const canvas = document.createElement('canvas');
    const size = 480; canvas.width=size; canvas.height=size*4/3;
    const ctx = canvas.getContext('2d');
    if(facing==='user'){ ctx.translate(size,0); ctx.scale(-1,1); }
    const vw=v.videoWidth||size, vh=v.videoHeight||size*4/3;
    const scale = Math.max(canvas.width/vw, canvas.height/vh);
    const sw=canvas.width/scale, sh=canvas.height/scale, sx=(vw-sw)/2, sy=(vh-sh)/2;
    ctx.drawImage(v, sx,sy,sw,sh, 0,0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.55);
    closeCam(); onCapture(dataUrl);
  };
  startStream();
}

/* ================= SCANNER (barcode 1D + QR) untuk Panitia & Tamu ================= */
/* Pemindai utama: ZXing (mendukung QR code DAN barcode garis 1D seperti Code128/EAN/UPC/Code39).
   Kalau ZXing gagal dimuat, otomatis jatuh ke jsQR (khusus QR code) sebagai cadangan. */
let scanState = { rafId:null, scanning:false };
let zxingReader = null;
function snapFrame(video){
  const c = document.createElement('canvas');
  const size = 480; c.width=size; c.height=size*4/3;
  const ctx = c.getContext('2d');
  const vw=video.videoWidth||size, vh=video.videoHeight||size*4/3;
  const scale = Math.max(c.width/vw, c.height/vh);
  const sw=c.width/scale, sh=c.height/scale, sx=(vw-sw)/2, sy=(vh-sh)/2;
  ctx.drawImage(video, sx,sy,sw,sh, 0,0, c.width, c.height);
  return c.toDataURL('image/jpeg',0.55);
}
function isZXingReady(){ return typeof ZXing!=='undefined' && ZXing.BrowserMultiFormatReader; }
function isJsQRReady(){ return typeof jsQR==='function'; }
function waitForScannerLib(timeoutMs){
  return new Promise(resolve=>{
    if(isZXingReady()||isJsQRReady()){ resolve(true); return; }
    const start = Date.now();
    const iv = setInterval(()=>{
      if(isZXingReady()||isJsQRReady()){ clearInterval(iv); resolve(true); }
      else if(Date.now()-start > timeoutMs){ clearInterval(iv); resolve(false); }
    }, 150);
  });
}
async function startScanner(videoElId, statusElId, onDetected){
  scanState = { rafId:null, scanning:true };
  const video = document.getElementById(videoElId);
  if(!video) return;
  const st = document.getElementById(statusElId);
  if(st) st.textContent = 'Membuka kamera...';
  try{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    }catch(e1){
      // Perangkat tanpa kamera belakang (mis. laptop) -> pakai kamera apa saja yang tersedia
      stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    }
    video.srcObject = stream;
    await video.play().catch(()=>{});
  }catch(e){
    let msg = 'Kamera tidak dapat diakses. Periksa izin kamera pada browser, lalu tekan tombol untuk mencoba lagi.';
    if(e && e.name==='NotAllowedError') msg = 'Izin kamera ditolak. Aktifkan izin kamera untuk situs ini di pengaturan browser, lalu tekan tombol untuk mencoba lagi.';
    else if(e && e.name==='NotFoundError') msg = 'Kamera tidak ditemukan pada perangkat ini.';
    if(st) st.textContent = msg;
    return;
  }
  if(st) st.textContent = 'Menyiapkan pemindai...';
  const ready = await waitForScannerLib(6000);
  if(!scanState.scanning) return; // pengguna sudah keluar dari layar
  if(!ready){
    if(st) st.textContent = 'Pemindai gagal dimuat (periksa koneksi internet), coba tekan tombol untuk mengulang.';
    return;
  }
  let handled = false;
  const finish = (text)=>{
    if(handled) return; handled = true;
    onDetected(text, video);
  };

  if(isZXingReady()){
    /* Mode utama: ZXing -> baca QR code maupun barcode garis 1D (Code128, EAN-13/8, UPC-A/E, Code39, Codabar, ITF, dll) */
    if(st) st.textContent = 'Arahkan kamera ke QR code atau barcode garis. Data akan muncul otomatis.';
    try{
      zxingReader = new ZXing.BrowserMultiFormatReader();
      let frameCount = 0;
      zxingReader.decodeFromVideoElement(video, (result, err)=>{
        if(!scanState.scanning || handled) return;
        if(result){ finish(result.getText()); return; }
        frameCount++;
        if(frameCount===140 && st){ st.textContent = 'Belum terdeteksi. Dekatkan/jauhkan kode dan pastikan cahaya cukup terang.'; }
      });
    }catch(e){
      if(st) st.textContent = 'Pemindai gagal dijalankan, coba tekan tombol untuk mengulang.';
    }
  }else if(isJsQRReady()){
    /* Cadangan: jsQR -> hanya bisa baca QR code */
    if(st) st.textContent = 'Arahkan kamera ke QR code. Data akan muncul otomatis.';
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    let frameCount = 0;
    function loop(){
      if(!scanState.scanning) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth>0){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        try{
          const img = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
          if(code && code.data){ finish(code.data); return; }
          frameCount++;
          if(frameCount===180 && st){ st.textContent = 'Belum terdeteksi. Dekatkan/jauhkan kode QR dan pastikan cahaya cukup terang.'; }
        }catch(e){}
      }
      scanState.rafId = requestAnimationFrame(loop);
    }
    loop();
  }
}
function stopScanner(){
  scanState.scanning = false;
  if(scanState.rafId) cancelAnimationFrame(scanState.rafId);
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
}
function parseScannedCode(text){
  text = (text||'').trim();
  // Barcode berupa link URL (mis. dari QR generator yang encode link + parameter)
  // -> ambil nilai dari parameter URL-nya, bukan link mentahnya
  try{
    if(/^https?:\/\//i.test(text)){
      const url = new URL(text);
      const p = url.searchParams;
      if([...p.keys()].length){
        return {
          nama: p.get('nama')||p.get('name')||p.get('Nama')||'',
          telp: p.get('telp')||p.get('hp')||p.get('phone')||p.get('no_hp')||'',
          asal: p.get('asal')||p.get('instansi')||'',
          divisi: p.get('divisi')||p.get('role')||p.get('divisi_panitia')||''
        };
      }
    }
  }catch(e){}
  try{
    const obj = JSON.parse(text);
    if(obj && typeof obj==='object'){
      return {
        nama: obj.nama||obj.name||obj.Nama||'',
        telp: obj.telp||obj.hp||obj.phone||obj.no_hp||'',
        asal: obj.asal||obj.instansi||obj.Asal||'',
        divisi: obj.divisi||obj.divisi_panitia||''
      };
    }
  }catch(e){}
  for(const d of ['|',';']){
    if(text.indexOf(d)>-1){
      const parts = text.split(d).map(s=>s.trim());
      return { nama: parts[0]||'', telp: parts[1]||'', asal: parts[2]||'', divisi: parts[1]||'' };
    }
  }
  return { nama:text, telp:'', asal:'', divisi:'' };
}

/* Parser umum untuk Tamu: menampilkan SEMUA data apa pun isi/format barcode-nya,
   tanpa mengasumsikan field tertentu. Mendukung JSON, pasangan key=value,
   daftar dipisah | atau ; , sampai teks polos. */
function parseAllFields(text){
  text = (text||'').trim();
  if(!text) return [{label:'Data', value:'(kosong)'}];
  // 1) JSON object -> pakai semua key-value apa adanya
  try{
    const obj = JSON.parse(text);
    if(obj && typeof obj==='object' && !Array.isArray(obj)){
      const keys = Object.keys(obj);
      if(keys.length){ return keys.map(k=>({label:k, value:String(obj[k])})); }
    }
  }catch(e){}
  const delim = /[|;\n]/;
  const hasDelim = delim.test(text);
  // 2) pasangan key=value dipisah | ; atau baris baru
  if(hasDelim && text.indexOf('=')>-1){
    const parts = text.split(delim).map(s=>s.trim()).filter(Boolean);
    if(parts.length && parts.every(p=>p.indexOf('=')>-1)){
      return parts.map(p=>{ const i=p.indexOf('='); return {label:p.slice(0,i).trim()||'Data', value:p.slice(i+1).trim()}; });
    }
  }
  // 3) daftar nilai polos dipisah | atau ;
  if(hasDelim){
    const parts = text.split(delim).map(s=>s.trim()).filter(Boolean);
    if(parts.length>1){ return parts.map((v,i)=>({label:'Data '+(i+1), value:v})); }
  }
  // 4) satu baris teks polos
  return [{label:'Data', value:text}];
}

let pesertaRecordsCache = {};
async function loadPesertaInputList(){
  const box = document.getElementById('studentList');
  const sumBox = document.getElementById('pesertaSummary');
  if(!box) return;
  const list = STUDENTS[state.classCode].students;
  const keys = await storeList(attKey(state.activity, state.classCode, ''));
  const records = await Promise.all(keys.map(k=>storeGet(k)));
  const map = {};
  records.filter(Boolean).forEach(r=>{ map[r.no]=r; });
  pesertaRecordsCache = map;
  updatePesertaSummary();
  renderPesertaRows();
  const qi = document.getElementById('quickId');
  if(qi){ qi.focus(); qi.onkeydown = (e)=>{ if(e.key==='Enter') quickMark(); }; }
}
function updatePesertaSummary(){
  const sumBox = document.getElementById('pesertaSummary');
  if(!sumBox) return;
  const list = STUDENTS[state.classCode].students;
  const hadirCount = Object.keys(pesertaRecordsCache).length;
  sumBox.innerHTML = `<div class="summary-bar" style="margin-bottom:0;">
    <div class="summary-pill"><div class="num">${hadirCount}</div><div class="lbl">Hadir</div></div>
    <div class="summary-pill"><div class="num">${list.length-hadirCount}</div><div class="lbl">Belum</div></div>
  </div>`;
}
function renderPesertaRows(){

  const list = STUDENTS[state.classCode].students;
  box.innerHTML = list.map(s=>{
    const r = pesertaRecordsCache[s.no];
    const done = !!r;
    return `
    <div class="student-row ${done?'done':''}" data-name="${esc(s.nama.toLowerCase())}" data-no="${s.no}">
      <span class="student-id">${studentId(state.classCode,s.no)}</span>
      <span class="student-name">${esc(s.nama)}</span>
      ${done
        ? `<span class="student-status">✓ ${(r.waktu||'').split(', ').pop()}</span>
           <span class="icon-btn" onclick="addPhotoTo(${s.no})">📷</span>
           <span class="icon-btn" style="color:#C0392B;" onclick="unmarkStudent(${s.no})">↺</span>`
        : `<button class="mark-btn" onclick="markStudent(${s.no})">Tandai</button>`}
    </div>`;
  }).join('');
}
function filterStudents(q){
  q = q.toLowerCase().trim();
  document.querySelectorAll('#studentList .student-row').forEach(row=>{
    const match = row.dataset.name.includes(q) || row.dataset.no===q.replace(/^0+/,'');
    row.style.display = (q==='' || match) ? 'flex' : 'none';
  });
}
async function markStudent(no){
  if(pesertaRecordsCache[no]){ toast('Siswa ini sudah tercatat hadir.'); return; }
  const student = STUDENTS[state.classCode].students.find(s=>s.no===no);
  const key = attKey(state.activity, state.classCode, no);
  const record = { nama: student.nama, kelas: state.classCode, no, waktu: nowStr(), foto: null, ts: Date.now() };
  const ok = await storeSet(key, record);
  if(ok){
    pesertaRecordsCache[no] = record;
    toast(student.nama+' — hadir ✓');
    renderPesertaRows();
    updatePesertaSummary();
  }
}
async function quickMark(){
  const input = document.getElementById('quickId');
  if(!input) return;
  let raw = input.value.trim().toUpperCase().replace(state.classCode+'-','').replace(/^0+/,'');
  const no = parseInt(raw,10);
  input.value='';
  if(!no || isNaN(no)){ toast('Masukkan nomor absen yang valid.'); return; }
  const student = STUDENTS[state.classCode].students.find(s=>s.no===no);
  if(!student){ toast('Nomor absen '+no+' tidak ditemukan di kelas ini.'); return; }
  await markStudent(no);
  input.focus();
}
async function unmarkStudent(no){
  const key = attKey(state.activity, state.classCode, no);
  await storeDelete(key);
  delete pesertaRecordsCache[no];
  toast('Status kehadiran dibatalkan.');
  renderPesertaRows();
  updatePesertaSummary();
}
function addPhotoTo(no){
  const student = STUDENTS[state.classCode].students.find(s=>s.no===no);
  openCamera(async (photo)=>{
    const key = attKey(state.activity, state.classCode, no);
    const record = pesertaRecordsCache[no] || {};
    record.foto = photo;
    await storeSet(key, record);
    pesertaRecordsCache[no] = record;
    toast('Foto ditambahkan untuk '+student.nama+'.');
    renderPesertaRows();
  }, {facing:'environment'});
}

function setDashActivity(id){ state.dashActivity=id; go('panitia-dashboard'); }
function setDashClass(c){ state.dashClass=c; go('panitia-dashboard'); }
async function loadDashboard(){
  const sumBox = document.getElementById('dashSummary');
  const detBox = document.getElementById('dashDetail');
  if(!sumBox) return;
  let totalHadir=0, totalSiswa=0; const perClass=[];
  for(const c of CLASS_ORDER){
    const keys = await storeList(attKey(state.dashActivity,c,''));
    const hadir = keys.length, total = STUDENTS[c].students.length;
    totalHadir+=hadir; totalSiswa+=total; perClass.push({c,hadir,total});
  }
  sumBox.innerHTML = `
    <div class="summary-bar">
      <div class="summary-pill"><div class="num">${totalHadir}</div><div class="lbl">Hadir</div></div>
      <div class="summary-pill"><div class="num">${totalSiswa-totalHadir}</div><div class="lbl">Belum</div></div>
      <div class="summary-pill"><div class="num">${totalSiswa? Math.round(totalHadir/totalSiswa*100):0}%</div><div class="lbl">Persentase</div></div>
    </div>
    <div class="card" style="padding:10px 14px;">
      <table class="recap"><thead><tr><th>Kelas</th><th>Hadir</th><th style="width:35%;">Progres</th></tr></thead><tbody>
      ${perClass.map(p=>`<tr><td class="mono">${p.c}</td><td>${p.hadir}/${p.total}</td><td><div class="bar-bg"><div class="bar-fill" style="width:${p.total?Math.round(p.hadir/p.total*100):0}%;"></div></div></td></tr>`).join('')}
      </tbody></table>
    </div>
    <button class="btn btn-secondary" style="margin-top:10px;" onclick="exportCSV()">⬇ Unduh CSV Kegiatan Ini</button>
  `;
  if(!detBox) return;
  const keys = await storeList(attKey(state.dashActivity, state.dashClass, ''));
  const records = await Promise.all(keys.map(k=>storeGet(k)));
  const valid = records.filter(Boolean).sort((a,b)=>a.no-b.no);
  const total = STUDENTS[state.dashClass].students.length;
  if(valid.length===0){ detBox.innerHTML = `<div class="empty-state"><div class="ic">🗒️</div>Belum ada peserta ${clsLabel(state.dashClass)} yang presensi untuk kegiatan ini.</div>`; return; }
  detBox.innerHTML = `<p style="font-size:12px; color:#7591A8; margin:0 0 10px;">${valid.length} dari ${total} siswa sudah hadir</p>
    <div class="gallery">${valid.map(r=>`<div class="g-item">${r.foto?`<img src="${r.foto}">`:`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:22px;">👤</div>`}<div class="g-name">${esc(r.nama.split(' ')[0])}</div></div>`).join('')}</div>`;
}
async function exportCSV(){
  toast('Menyiapkan file CSV...');
  let rows = [['ID','Nama','Kelas','Kegiatan','Waktu']];
  for(const c of CLASS_ORDER){
    const keys = await storeList(attKey(state.dashActivity,c,''));
    const records = await Promise.all(keys.map(k=>storeGet(k)));
    records.filter(Boolean).sort((a,b)=>a.no-b.no).forEach(r=>{
      rows.push([studentId(c,r.no), r.nama, clsLabel(c), actLabel(state.dashActivity), r.waktu]);
    });
  }
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='presensi_'+state.dashActivity+'.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

  box.innerHTML = `<p style="font-size:12px;color:#7591A8;margin:0 0 10px;">${valid.length} tamu hadir</p>` + valid.map(r=>{
    const fields = r.fields||[];
    const headline = fields[0] ? fields[0].value : '-';
    const rest = fields.slice(1).map(f=>f.value).filter(Boolean).join(' · ');
    return `
    <div class="student-row" style="margin-bottom:8px;">
      ${r.foto?`<img src="${r.foto}" style="width:40px;height:40px;border-radius:10px;object-fit:cover;">`:`<span class="student-id">🎪</span>`}
      <span class="student-name">${esc(headline)}<br><span style="font-weight:400;font-size:11px;color:#7591A8;">${esc(rest)}${rest?' · ':''}${r.waktu}</span></span>
    </div>`;
  }).join('');
}

/* ---------- REKAP PANITIA ---------- */
function renderPanitiaRecapScreen(){
  if(!state.dashPanitiaAct) state.dashPanitiaAct = PANITIA_ACTIVITIES[0].id;
  setTimeout(loadPanitiaRecap,0);
  return `
  ${topbar({eyebrow:'Panitia', title:'Rekap Panitia', back:"go('panitia-home')"})}
  <div class="content">
    <div class="tabbar">${PANITIA_ACTIVITIES.map(a=>`<div class="tab ${state.dashPanitiaAct===a.id?'active':''}" onclick="setDashPanitiaAct('${a.id}')">${a.label}</div>`).join('')}</div>
    <div id="panitiaRecapList"><div class="loader"><div class="spin"></div>Memuat...</div></div>
  </div>`;
}
function setDashPanitiaAct(id){ state.dashPanitiaAct=id; go('panitia-panitia-recap'); }
async function loadPanitiaRecap(){
  const box = document.getElementById('panitiaRecapList');
  if(!box) return;
  const keys = await storeList('patt:'+state.dashPanitiaAct+':');
  const records = await Promise.all(keys.map(k=>storeGet(k)));
  const valid = records.filter(Boolean).sort((a,b)=>b.ts-a.ts);
  if(valid.length===0){ box.innerHTML = `<div class="empty-state"><div class="ic">🪪</div>Belum ada panitia yang presensi untuk hari ini.</div>`; return; }
  box.innerHTML = `<p style="font-size:12px;color:#7591A8;margin:0 0 10px;">${valid.length} panitia hadir</p>` + valid.map(r=>`
    <div class="student-row" style="margin-bottom:8px;">
      ${r.foto?`<img src="${r.foto}" style="width:40px;height:40px;border-radius:10px;object-fit:cover;">`:`<span class="student-id">👤</span>`}
      <span class="student-name">${esc(r.nama)}<br><span style="font-weight:400;font-size:11px;color:#7591A8;">${esc(r.divisi||'-')} · ${r.waktu}</span></span>
    </div>`).join('');
}

/* ---------- INIT ---------- */
(async function init(){
  render();
  await detectStorageMode();
  render();
})();
</script>
</body>
</html>
